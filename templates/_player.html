{% if tracks %}
<div class="music-player style-{{ settings.player_style|default('vinyl') }}" id="player"
     data-autoplay="{{ settings.player_autoplay }}"
     data-volume="{{ settings.player_volume|default('80') }}">
  <audio id="player-audio" preload="metadata"></audio>

  <div class="mp-inner">
    <button class="mp-disc" id="p-disc" title="播放 / 暂停" aria-label="播放或暂停">
      <img id="p-cover-img" alt="" hidden>
      <span class="mp-fallback" id="p-cover-fallback">♪</span>
      <span class="mp-hole" aria-hidden="true"></span>
    </button>

    <div class="mp-body">
      <div class="mp-top">
        <div class="mp-meta">
          <div class="mp-title" id="p-title">点击播放音乐</div>
          <div class="mp-artist" id="p-artist">{{ settings.site_title }} · 音乐</div>
        </div>
        <div class="mp-controls">
          <button id="p-prev" class="mp-btn" title="上一曲" aria-label="上一曲">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button id="p-play" class="mp-btn mp-play" title="播放/暂停" aria-label="播放">
            <svg id="p-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="p-icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="p-next" class="mp-btn" title="下一曲" aria-label="下一曲">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
        </div>
      </div>

      <div class="mp-progress">
        <span id="p-cur">0:00</span>
        <input id="p-seek" type="range" min="0" max="1000" value="0" aria-label="进度">
        <span id="p-dur">0:00</span>
      </div>

      <div class="mp-volume">
        <button id="p-mute" class="mp-btn mp-mute" title="静音" aria-label="静音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        </button>
        <input id="p-volume" type="range" min="0" max="100" value="{{ settings.player_volume|default('80') }}" aria-label="音量">
      </div>
    </div>
  </div>

  <div class="mp-embed" id="p-embed" hidden>
    <div class="mp-embed-head">
      <span id="p-embed-name">平台播放器</span>
      <button class="mp-close" data-close="p-embed" aria-label="关闭">×</button>
    </div>
    <iframe id="p-iframe" allow="autoplay; encrypted-media" frameborder="0" width="100%" height="90"></iframe>
  </div>
</div>
<script id="tracks-data" type="application/json">{{ tracks|tojson }}</script>
{% endif %}
